name: Specific improvement
description: Propose a concrete change to a template, script, or workflow
title: "[Improvement]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and compatibility cost
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
